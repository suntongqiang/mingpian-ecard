<style>
:root{
--navy:#1a2a80;
--red:#e51e25;
--page-bg:radial-gradient(1200px 800px at 80% -10%, #1a2a80 0%, transparent 55%),
          radial-gradient(900px 700px at -10% 110%, #1a2a80 0%, transparent 50%),
          linear-gradient(160deg,#101a4f 0%, #1a2a80 45%, #1a2a80 100%);
--card-bg:linear-gradient(150deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 40%,rgba(255,255,255,.02) 100%);
--card-border:rgba(255,255,255,.22);
--card-shadow:0 24px 60px rgba(5,10,40,.5), inset 0 1px 0 rgba(255,255,255,.25);
--text:#ffffff;
--muted:rgba(255,255,255,.72);
--name-grad:linear-gradient(100deg,#ffffff 30%,#cfe0ff 55%,#ffffff 80%);
--ic-bg:rgba(255,255,255,.12);
--hint:rgba(255,255,255,.45);
--btn-bg:rgba(255,255,255,.1);
--btn-border:rgba(255,255,255,.25);
--btn-color:#fff;
--wave1:rgba(61,99,210,.35);
--wave2:rgba(20,31,94,.8);
--glow:rgba(229,30,37,.7);
}
body.theme-light{
--page-bg:radial-gradient(1000px 700px at 85% -10%, #dbe6ff 0%, transparent 55%), linear-gradient(160deg,#f6f8ff 0%, #eef2fd 100%);
--card-bg:linear-gradient(150deg,#ffffff 0%, #f7f9ff 100%);
--card-border:rgba(26,42,128,.12);
--card-shadow:0 24px 60px rgba(26,42,128,.16);
--text:#1a224f;
--muted:rgba(26,34,79,.66);
--name-grad:linear-gradient(100deg,#1a2a80 30%, #3d63d2 55%, #1a2a80 80%);
--ic-bg:rgba(26,42,128,.08);
--hint:rgba(26,34,79,.35);
--btn-bg:#ffffff;
--btn-border:rgba(26,42,128,.18);
--btn-color:#1a2a80;
--wave1:rgba(61,99,210,.28);
--wave2:#2b47b8;
--glow:rgba(229,30,37,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--page-bg);color:var(--text);min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden;transition:background .5s ease, color .5s ease}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0;animation:drift 14s ease-in-out infinite alternate}
body.theme-light .blob{opacity:.5}
.blob.b1{width:340px;height:340px;background:#3d63d2;top:-80px;right:-60px}
.blob.b2{width:280px;height:280px;background:#e51e25;bottom:-100px;left:-80px;opacity:.16;animation-delay:-6s}
body.theme-light .blob.b2{opacity:.12}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-30px,24px) scale(1.12)}}
.wrap{position:relative;z-index:1;width:100%;max-width:460px;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center}
.rise{opacity:0;transform:translateY(22px);animation:rise .7s cubic-bezier(.22,.8,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.32s}.d4{animation-delay:.46s}
.brand{position:absolute;top:20px;right:18px;z-index:2;padding:5px;border-radius:12px}
.brand img{width:46px;height:46px;border-radius:8px;object-fit:contain;background:rgba(255,255,255,.92);animation:spin-in .9s cubic-bezier(.2,.9,.3,1.2) both}
body.theme-light .brand img{filter:none}
@keyframes spin-in{from{opacity:0;transform:rotate(-40deg) scale(.6)}to{opacity:1;transform:none}}
.brand .cn{font-size:15px;font-weight:600;letter-spacing:2px;color:var(--muted)}
.intro{font-size:12.5px;opacity:.9;margin-top:8px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.theme-toggle{position:absolute;top:26px;right:0;z-index:5;padding:8px 14px;border-radius:30px;font-size:12.5px;letter-spacing:1px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-color);cursor:pointer;transition:transform .15s;backdrop-filter:blur(6px)}
.theme-toggle:active{transform:scale(.92)}
.scene{width:100%;perspective:1400px;margin-bottom:22px}
.card3d{position:relative;width:100%;aspect-ratio:0.72/1;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow);padding:30px 26px;display:flex;flex-direction:column;overflow:hidden;transition:background .5s}
.face.back{transform:rotateY(180deg);align-items:center;justify-content:center;gap:14px}
.face::after{content:"";position:absolute;top:0;left:-70%;width:55%;height:100%;background:linear-gradient(105deg,transparent,var(--gloss,rgba(255,255,255,.14)),transparent);transform:skewX(-18deg);animation:gloss 5.5s ease-in-out infinite;}
body.theme-light .face::after{--gloss:rgba(61,99,210,.08)}
@keyframes gloss{0%,55%{left:-70%}80%,100%{left:130%}}
.wave{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;opacity:.95}
.wave .w1{fill:var(--wave1)}
.wave .w2{fill:var(--wave2)}
.name-row{display:flex;align-items:baseline;gap:12px;margin-top:12px}
.name{font-size:44px;font-weight:800;letter-spacing:6px;background:var(--name-grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4.5s linear infinite;}
@keyframes shimmer{to{background-position:-200% 0}}
.title{font-size:16px;color:var(--muted);letter-spacing:2px}
.redbar{width:44px;height:4px;background:var(--red);border-radius:2px;margin:14px 0 18px;box-shadow:0 0 12px var(--glow)}
.mobile{font-size:30px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.company{margin-top:auto;padding-bottom:96px}
.company .cn-name{font-size:19px;font-weight:700;letter-spacing:1px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);padding:6px 0}
.row a{color:inherit;text-decoration:none}
.ic{width:30px;height:30px;border-radius:9px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.tap-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--hint);letter-spacing:1px}
.qr-box{background:#fff;border-radius:20px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);animation:pop .5s .3s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.qr-box img{display:block;width:min(52vw,210px);height:auto;border-radius:8px}
.back-t1{font-size:18px;font-weight:700;letter-spacing:2px}
.back-t2{font-size:12.5px;color:var(--muted)}
.back-actions{display:flex;gap:12px;margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:16px;font-size:15.5px;font-weight:600;letter-spacing:1px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-color);transition:transform .15s ease, background .2s;backdrop-filter:blur(6px);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.95)}
.btn.primary{grid-column:1 / -1;background:linear-gradient(120deg,#e51e25,#c3141b);border:none;color:#fff;box-shadow:0 10px 26px rgba(229,30,37,.4);font-size:17px;padding:17px}
.btn.blue{grid-column:1 / -1;background:linear-gradient(120deg,#2b47b8,#3d63d2);border:none;color:#fff;box-shadow:0 8px 22px rgba(43,71,184,.45)}
.foot{margin-top:26px;font-size:11.5px;color:var(--hint);letter-spacing:1px;text-align:center;line-height:1.8}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:rgba(10,15,45,.92);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;letter-spacing:1px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
